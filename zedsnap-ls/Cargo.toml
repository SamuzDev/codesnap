[package]
name = "zedsnap-ls"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
description = "Language server that copies or saves code screenshots — the engine behind the ZedSnap extension for Zed."

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
lsp-server = "0.10"
lsp-types = "0.95"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
resvg = "0.48"

[profile.release]
lto = true
strip = true
