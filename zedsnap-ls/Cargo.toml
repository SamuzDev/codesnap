[package]
name = "zedsnap-ls"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
description = "Language server that generates code screenshots — the engine behind the ZedSnap extension for Zed."

[dependencies]
anyhow = "1"
jpeg-encoder = "0.7"
lsp-server = "0.10"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
resvg = "0.48"

[profile.release]
lto = true
strip = true
